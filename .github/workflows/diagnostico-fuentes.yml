name: Diagnóstico de fuentes

# Comprueba desde un runner con salida a internet que las rutas del DOF y de la
# Gaceta siguen vivas, y con qué host/certificado responden. Útil cuando el
# digest sale vacío o con incidencias: dice exactamente qué ruta se rompió.

on:
  workflow_dispatch:
    inputs:
      fecha:
        description: "Día hábil a probar (AAAA-MM-DD)"
        required: false
        default: "2026-08-28"
        type: string

permissions:
  contents: read

jobs:
  sondear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Estructura de las fuentes
        env:
          FECHA: ${{ inputs.fecha || '2026-08-28' }}
        run: python tools/sonda_fuentes.py --fecha "$FECHA"

      - name: Rutas y certificados
        env:
          FECHA: ${{ inputs.fecha || '2026-08-28' }}
        run: |
          set -u
          D=$(date -u -d "$FECHA" +%d-%m-%Y)
          Y=$(date -u -d "$FECHA" +%Y); M=$(date -u -d "$FECHA" +%m); DD=$(date -u -d "$FECHA" +%d)

          probe () {
            local url="$1"; shift
            local info
            info=$(curl -sS -L --max-time 25 -o /dev/null \
                   -w '%{http_code} %{size_download}B -> %{url_effective}' \
                   -A 'dofwatch-diagnostico/1.0' "$@" "$url" 2>/tmp/err) \
              || info="ERROR: $(head -c 200 /tmp/err | tr '\n' ' ')"
            printf '%-72s %s\n' "$url" "$info"
          }

          echo "--- DOF: servicio JSON (SIDOF)"
          probe "https://sidofqa.segob.gob.mx/dof/sidof/documentos/completo/$D"
          probe "https://sidof.segob.gob.mx/dof/sidof/documentos/completo/$D"
          echo "--- DOF: web pública"
          probe "https://dof.gob.mx/index.php?year=$Y&month=$M&day=$DD"
          probe "https://www.dof.gob.mx/index.php?year=$Y&month=$M&day=$DD"
          probe "https://diariooficial.gob.mx/index.php?year=$Y&month=$M&day=$DD"
          echo "--- certificados"
          for h in dof.gob.mx www.dof.gob.mx gaceta.diputados.gob.mx; do
            printf '%-28s ' "$h"
            echo | timeout 20 openssl s_client -connect "$h":443 -servername "$h" 2>/dev/null \
              | openssl x509 -noout -ext subjectAltName 2>/dev/null | tail -1
          done
