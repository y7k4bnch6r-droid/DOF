# Configuración general del monitor. Todos los valores admiten override por CLI.
# Los secretos (SMTP, webhooks) se leen de variables de entorno, nunca de aquí.

keywords_file: config/keywords.yml

paths:
  digests_dir: digests
  database: data/state.sqlite3
  cache_dir: .cache

http:
  user_agent: "dofwatch/0.1 (monitor de politicas de vejez; +https://github.com/y7k4bnch6r-droid/DOF)"
  timeout: 45
  max_retries: 4
  backoff_seconds: 2.0      # 2, 4, 8, 16 en reintentos sucesivos
  delay_seconds: 0.6        # pausa mínima entre peticiones al mismo host
  cache_enabled: true
  cache_ttl_days: 45

matching:
  snippet_chars: 140
  max_snippets: 3
  min_score: 1              # descarta documentos por debajo de este puntaje

dof:
  enabled: true
  # Fuente primaria: servicio JSON del DOF (SIDOF). Si falla, se cae al HTML.
  api_base: "https://sidofqa.segob.gob.mx/dof/sidof"
  web_base: "https://www.dof.gob.mx"
  full_text: true           # false = sólo títulos (mucho más rápido)
  skip_weekends: true       # el DOF no publica sábados ni domingos
  editions: [MAT, VES, EXT]

gaceta:
  enabled: true
  base: "http://gaceta.diputados.gob.mx"
  full_text: true           # texto de la página índice del día
  pdf_full_text: false      # además, descarga y extrae texto de los PDFs (lento)
  pdf_max_per_day: 40
  # Legislaturas: se elige por fecha de publicación.
  legislaturas:
    - numero: 64
      inicio: "2018-09-01"
      fin: "2021-08-31"
    - numero: 65
      inicio: "2021-09-01"
      fin: "2024-08-31"
    - numero: 66
      inicio: "2024-09-01"
      fin: "2027-08-31"
    - numero: 67
      inicio: "2027-09-01"
      fin: "2030-08-31"

digest:
  title: "Monitor de vejez y envejecimiento"
  formats: [md, json, html]
  group_by: source          # source | term | date
  include_snippets: true

notify:
  email_enabled: false      # requiere SMTP_HOST/SMTP_USER/SMTP_PASSWORD y notify.email_to
  email_to: []
  email_from: null
  webhook_enabled: false    # requiere DOFWATCH_WEBHOOK_URL (Slack/Teams/genérico)
